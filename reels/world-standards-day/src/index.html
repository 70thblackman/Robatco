<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Robat · World Standards Day reel</title>
<style>
@font-face{font-family:"Vazirmatn";src:url("../assets/fonts/Vazirmatn-variable.woff2") format("woff2");font-weight:100 900;font-display:block}
:root{--red:#e31e24;--gold:#e0c577;--gold-d:#a69552;--ink:#101010;--navy:#0a1730;--navy2:#13264a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Vazirmatn",sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#0b0b0d}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;overflow:hidden}

/* ---------- photo scenes ---------- */
.bg{position:absolute;inset:-60px;overflow:hidden}
.bg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(1.15);transform-origin:50% 50%}
.bgshade{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 38%,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 85%),
  linear-gradient(to bottom,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.65) 100%)}
.frame{position:absolute;left:0;top:440px;width:1080px;height:800px;overflow:hidden;background:#000;
  box-shadow:0 30px 90px rgba(0,0,0,.55)}
.frame img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.fvig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%)}
.gline{position:absolute;left:0;height:4px;width:1080px;background:linear-gradient(to left,rgba(224,197,119,0),var(--gold) 12%,var(--gold) 88%,rgba(224,197,119,0))}
.gline.top{top:436px}
.gline.bot{top:1240px;background:rgba(224,197,119,.25)}
.gline.bot i{position:absolute;right:0;top:0;height:100%;width:100%;background:var(--gold);transform-origin:100% 50%}
.tag{position:absolute;top:338px;right:60px;left:60px;height:64px;display:flex;align-items:center;gap:18px;direction:rtl}
.tag .dot{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(227,30,36,.25);flex:none}
.tag .txt{font-size:38px;font-weight:700;color:var(--gold);letter-spacing:0;white-space:nowrap;text-shadow:0 2px 16px rgba(0,0,0,.7)}
.tag .ln{height:2px;flex:1;background:linear-gradient(to left,rgba(224,197,119,.7),rgba(224,197,119,0))}

/* ---------- captions ---------- */
.cap{position:absolute;left:100px;width:880px;top:1296px;text-align:center;direction:rtl;font-weight:800;font-size:57px;line-height:1.56;
  text-shadow:0 3px 22px rgba(0,0,0,.75),0 1px 2px rgba(0,0,0,.6)}
.cap .w{display:inline-block;will-change:transform,opacity}
.cap .k{color:var(--gold)}
.cap.p{top:1296px}

/* ---------- portrait scenes ---------- */
.world{position:absolute;left:0;top:0;width:1539px;height:2196px;transform-origin:0 0;will-change:transform}
.world img{position:absolute;display:block}
#pA{left:0;top:0;width:1539px;height:2196px}
#pB,#pB2{left:0;top:0;width:1539px;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 150px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 150px),transparent 100%)}
.pshade{position:absolute;left:0;bottom:0;width:1080px;height:1150px;background:linear-gradient(to top,rgba(6,14,32,.92) 0%,rgba(6,14,32,.7) 28%,rgba(6,14,32,0) 100%)}
.ptop{position:absolute;left:0;top:0;width:1080px;height:520px;background:linear-gradient(to bottom,rgba(6,14,32,.55),rgba(6,14,32,0))}
.glow{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(circle at 50% 36%,rgba(255,226,150,.55),rgba(255,226,150,0) 55%);mix-blend-mode:soft-light}

/* ---------- header ---------- */
#hdr{position:absolute;left:50%;top:168px;height:98px;padding:0 34px 0 14px;display:flex;align-items:center;gap:20px;direction:rtl;
  background:rgba(10,16,30,.66);border:1.5px solid rgba(224,197,119,.6);border-radius:50px;transform:translateX(-50%);white-space:nowrap;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
#hdr img{width:74px;height:74px;border-radius:18px;display:block}
#hdr .l1{font-size:36px;font-weight:800;line-height:1.25}
#hdr .l2{font-size:19px;font-weight:600;letter-spacing:2.4px;color:var(--gold);direction:ltr;text-align:right;line-height:1.3}

/* ---------- seal ---------- */
#seal{position:absolute;left:84px;top:950px;width:290px;height:290px;opacity:0;transform-origin:50% 50%;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
#seal svg{width:100%;height:100%;display:block}
#ring{position:absolute;left:84px;top:950px;width:290px;height:290px;border-radius:50%;border:5px solid var(--gold);opacity:0;pointer-events:none}

/* ---------- end card ---------- */
#s9{background:radial-gradient(ellipse at 50% 34%,#1b3568 0%,var(--navy) 62%,#050b18 100%)}
#s9 .pat{position:absolute;inset:0;opacity:.07;background-image:
  repeating-linear-gradient(45deg,transparent 0 46px,var(--gold) 46px 47px),
  repeating-linear-gradient(-45deg,transparent 0 46px,var(--gold) 46px 47px)}
#orn{position:absolute;left:110px;top:410px;width:860px;height:560px;overflow:visible}
#name{position:absolute;left:110px;width:860px;top:560px;text-align:center;font-size:112px;font-weight:800;line-height:1.3;white-space:nowrap}
#dates{position:absolute;left:110px;width:860px;top:722px;text-align:center;font-size:84px;font-weight:700;color:var(--gold);line-height:1.3}
#occ{position:absolute;left:60px;width:960px;top:1034px;text-align:center;font-size:40px;font-weight:600;color:#dfe6f5}
#occ b{color:var(--gold);font-weight:800}
#logo{position:absolute;left:410px;top:1120px;width:260px;height:260px;border-radius:52px;box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 2px rgba(224,197,119,.35)}
#site{position:absolute;left:0;width:1080px;top:1404px;text-align:center;font-size:38px;font-weight:600;letter-spacing:3px;color:var(--gold);direction:ltr}

/* ---------- global fx ---------- */
#grain{position:absolute;inset:-40px;opacity:.085;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 62%,rgba(0,0,0,.45) 100%);pointer-events:none}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff6dc,#f3d98d 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
#fadein{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#dust{position:absolute;inset:0;pointer-events:none;opacity:0}
#dust i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff0bd,rgba(255,224,140,0) 70%)}
</style>
</head>
<body>
<div id="stage">
  <!-- scenes are injected by main.js -->
  <div id="scenes"></div>

  <div id="hdr">
    <img src="../assets/src/robat-logo.png" alt="">
    <div>
      <div class="l1">روز جهانی استاندارد</div>
      <div class="l2">WORLD STANDARDS DAY · ۱۴ اکتبر</div>
    </div>
  </div>

  <div id="ring"></div>
  <div id="seal">
    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="150" r="146" fill="#d4161d"/>
      <circle cx="150" cy="150" r="140" fill="none" stroke="#f3dc93" stroke-width="6"/>
      <circle cx="150" cy="150" r="124" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.4" stroke-dasharray="1.5 8" stroke-linecap="round"/>
      <circle cx="150" cy="150" r="106" fill="none" stroke="#f3dc93" stroke-width="2.4"/>
      <g fill="#f3dc93">
        <path id="st" d="M0 -13 l4.4 9.6 10.4 1.2 -7.7 7.1 2.1 10.3 -9.2 -5.2 -9.2 5.2 2.1 -10.3 -7.7 -7.1 10.4 -1.2z" transform="translate(110 78)"/>
        <use href="#st" transform="translate(40 -8)"/><use href="#st" transform="translate(80 0)"/>
      </g>
      <text x="150" y="132" text-anchor="middle" font-family="Vazirmatn" font-weight="800" font-size="36" fill="#fff" direction="rtl">استاندارد ملی</text>
      <text x="150" y="214" text-anchor="middle" font-family="Vazirmatn" font-weight="900" font-size="96" fill="#fff" direction="rtl" style="letter-spacing:2px">۲۳۰۳</text>
      <path d="M96 232 L204 232" stroke="#f3dc93" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="dust"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="fadein"></div>
</div>

<script src="main.js"></script>
</body>
</html>
